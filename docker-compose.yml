version: '3.8'

networks:
  backend-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local

services:
  postgres:
    image: postgres:16
    container_name: pos-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pos_backup
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - backend-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pos-backend-api
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/pos_backup?sslmode=disable
      PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - backend-network
    restart: unless-stopped
    command: ["./bin/m2s", "serve"]

  swagger-ui:
    image: swaggerapi/swagger-ui
    container_name: pos-swagger-ui
    ports:
      - "8081:8080"
    environment:
      SPEC_URL: /api/v1/swagger.json
    networks:
      - backend-network
    restart: unless-stopped