# FE-301 — Task Contract: Flutter Fitur Backup

schema_version: "1.0"

task:
  id: FE-301
  title: "Flutter: halaman backup + UUID + kirim/hapus per-batch + restore"
  type: frontend-implementation
  project: pos-penglaris
  status: technical-ready
  requirement_ids:
    - REQ-POS-002
    - REQ-POS-003
    - REQ-POS-004
    - REQ-POS-005
    - REQ-POS-006
    - REQ-POS-007
    - REQ-POS-008
    - REQ-POS-009
    - REQ-POS-010
    - REQ-POS-012
    - REQ-POS-013
  business_rule_ids:
    - BL-AN-001
    - BL-AN-002
    - BL-AN-003
    - BL-AN-004
    - BL-AN-005
    - BL-AN-006
  contract_ids:
    - CONTRACT-301

ownership:
  role: android-developer
  repository: POS-android
  base_branch: develop
  branch: agent/FE-301-flutter-backup

execution:
  isolation: worktree
  background: true
  max_turns: 120
  timeout_minutes: 90

paths:
  allowed:
    - lib/**
    - test/**
    - pubspec.yaml
  forbidden:
    - .claude/**
    - .task/**
    - contracts/**

inputs:
  - contracts/CONTRACT-301.yaml

acceptance_criteria:
  - "First run: generate UUID v4, simpan via shared_preferences, dipakai sebagai user_id semua request backup; UUID ditampilkan di halaman Akun dengan opsi copy/ekspor manual"
  - "Halaman backup menampilkan ukuran storage yang dipakai aplikasi (dihitung dari data lokal aplikasi, bukan total device) via path_provider"
  - "Button 'backup data' membuka bottomsheet rentang tanggal (pola bottomsheet existing dipakai form kategori); kirim per-batch maks 500 transaksi"
  - "Batch dihapus dari storage lokal (sqflite/hive) hanya setelah ack server; data utuh di device sampai backup berhasil"
  - "Restore via GET /api/v1/backup dengan param user_id + start_date + end_date; UUID input manual untuk restore di device baru"
  - "Kondisi offline/failure memakai screen error existing (No connection / Error state) dan tidak kehilangan data"
  - "Unit test Flutter: generate/simpan UUID, format rentang tanggal, ack → hapus per-batch, restore parse response"

quality_gates:
  - flutter analyze
  - flutter test

outputs:
  - code
  - unit-tests
  - pull-request

stop_conditions:
  - contract change required
  - dependency required
  - data-loss risk found